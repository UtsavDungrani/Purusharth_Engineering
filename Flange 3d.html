    <script>
      // Load Three.js with fallback
      function loadThreeJS() {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "https://unpkg.com/three@0.158.0/build/three.min.js";
          script.onload = () => resolve();
          script.onerror = () => {
            // Fallback to CDNJS
            const fallbackScript = document.createElement("script");
            fallbackScript.src =
              "https://cdnjs.cloudflare.com/ajax/libs/three.js/r158/three.min.js";
            fallbackScript.onload = () => resolve();
            fallbackScript.onerror = () =>
              reject(new Error("Failed to load Three.js from all sources"));
            document.head.appendChild(fallbackScript);
          };
          document.head.appendChild(script);
        });
      }
    </script>
    <script>
      class FlangeDesigner {
        constructor() {
          this.scene = null;
          this.camera = null;
          this.renderer = null;
          this.flangeGroup = null;
          this.controls = null;

          this.params = {
            outerDiameter: 40,
            innerDiameter: 20,
            thickness: 5,
            boltHoles: 6,
            boltCircleDiameter: 30,
            boltHoleSize: 4,
            materialColor: 0x888888,
          };

          this.mouse = {
            isDown: false,
            lastX: 0,
            lastY: 0,
          };

          this.rotation = {
            x: 0,
            y: 0,
            targetX: 0,
            targetY: 0,
          };

          this.init();
        }

        init() {
          try {
            this.checkDependencies();
            this.setupScene();
            this.setupCamera();
            this.setupRenderer();
            this.setupLighting();
            this.setupControls();
            this.setupEventListeners();
            this.createFlange();
            this.animate();
            this.showUI();
          } catch (error) {
            this.showError(error.message);
          }
        }

        checkDependencies() {
          if (typeof THREE === "undefined") {
            throw new Error("Three.js library failed to load");
          }
          if (!window.WebGLRenderingContext) {
            throw new Error("WebGL is not supported in this browser");
          }
        }

        setupScene() {
          this.scene = new THREE.Scene();
          this.scene.background = new THREE.Color(0x1a1a2e);
        }

        setupCamera() {
          const aspect = window.innerWidth / window.innerHeight;
          this.camera = new THREE.PerspectiveCamera(60, aspect, 0.1, 1000);
          this.camera.position.set(50, 30, 50);
          this.camera.lookAt(0, 0, 0);
        }

        setupRenderer() {
          this.renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true,
          });
          this.renderer.setSize(window.innerWidth, window.innerHeight);
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          this.renderer.shadowMap.enabled = true;
          this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
          this.renderer.outputEncoding = THREE.sRGBEncoding;
          this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
          this.renderer.toneMappingExposure = 1.2;

          const container = document.getElementById("canvas-container");
          container.appendChild(this.renderer.domElement);
        }

        setupLighting() {
          // Ambient light
          const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
          this.scene.add(ambientLight);

          // Main directional light
          const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
          mainLight.position.set(50, 50, 50);
          mainLight.castShadow = true;
          mainLight.shadow.mapSize.width = 2048;
          mainLight.shadow.mapSize.height = 2048;
          mainLight.shadow.camera.near = 0.5;
          mainLight.shadow.camera.far = 500;
          mainLight.shadow.camera.left = -100;
          mainLight.shadow.camera.right = 100;
          mainLight.shadow.camera.top = 100;
          mainLight.shadow.camera.bottom = -100;
          this.scene.add(mainLight);

          // Fill light
          const fillLight = new THREE.DirectionalLight(0x4488ff, 0.3);
          fillLight.position.set(-30, 30, 30);
          this.scene.add(fillLight);

          // Rim light
          const rimLight = new THREE.DirectionalLight(0xff8844, 0.2);
          rimLight.position.set(0, -30, -30);
          this.scene.add(rimLight);
        }

        createFlangeGeometry() {
          const outerRadius = this.params.outerDiameter / 2;
          const innerRadius = this.params.innerDiameter / 2;
          const thickness = this.params.thickness;
          const seamOffset = Math.PI / 256; // offset to move UV/vertex seam

          // Create the main flange shape
          const shape = new THREE.Shape();
          shape.absarc(
            0,
            0,
            outerRadius,
            seamOffset,
            seamOffset + Math.PI * 2,
            false,
          );
          shape.autoClose = true;

          // Create inner hole
          const innerHole = new THREE.Path();
          innerHole.absarc(
            0,
            0,
            innerRadius,
            seamOffset,
            seamOffset + Math.PI * 2,
            true,
          );
          innerHole.autoClose = true;
          shape.holes.push(innerHole);

          // Create bolt hole paths
          const boltHoleRadius = this.params.boltHoleSize / 2;
          // Desired bolt circle radius from PCD, clamped to remain within the ring
          const desiredBoltCircleRadius = this.params.boltCircleDiameter / 2;
          const minBoltCircleRadius = innerRadius + boltHoleRadius + 0.1;
          const maxBoltCircleRadius = outerRadius - boltHoleRadius - 0.1;
          const boltCircleRadius = Math.min(
            Math.max(desiredBoltCircleRadius, minBoltCircleRadius),
            maxBoltCircleRadius,
          );

          for (let i = 0; i < this.params.boltHoles; i++) {
            const angle = (i / this.params.boltHoles) * Math.PI * 2;
            const x = Math.cos(angle) * boltCircleRadius;
            const y = Math.sin(angle) * boltCircleRadius;

            const boltHole = new THREE.Path();
            boltHole.absarc(
              x,
              y,
              boltHoleRadius,
              seamOffset,
              seamOffset + Math.PI * 2,
              true,
            );
            boltHole.autoClose = true;
            shape.holes.push(boltHole);
          }

          // Extrude settings
          const extrudeSettings = {
            depth: thickness,
            bevelEnabled: false,
            bevelThickness: 0,
            bevelSize: 0,
            bevelOffset: 0,
            bevelSegments: 0,
            curveSegments: 256,
          };

          const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
          geometry.translate(0, 0, -thickness / 2);
          geometry.computeVertexNormals();

          return geometry;
        }

        createFlange() {
          if (this.flangeGroup) {
            this.scene.remove(this.flangeGroup);
          }

          this.flangeGroup = new THREE.Group();

          // Create main flange body
          const geometry = this.createFlangeGeometry();
          const material = new THREE.MeshStandardMaterial({
            color: this.params.materialColor,
            metalness: 0.45,
            roughness: 0.5,
            envMapIntensity: 0.35,
          });

          const flangeMesh = new THREE.Mesh(geometry, material);
          flangeMesh.castShadow = true;
          flangeMesh.receiveShadow = true;
          this.flangeGroup.add(flangeMesh);

          this.scene.add(this.flangeGroup);
        }

        setupControls() {
          const controls = {
            outerDiameter: document.getElementById("outerDiameter"),
            innerDiameter: document.getElementById("innerDiameter"),
            thickness: document.getElementById("thickness"),
            boltHoles: document.getElementById("boltHoles"),
            boltCircleDiameter: document.getElementById("boltCircleDiameter"),
            boltHoleSize: document.getElementById("boltHoleSize"),
            materialColor: document.getElementById("materialColor"),
          };

          const valueDisplays = {
            outerDiameter: document.getElementById("outerDiameterValue"),
            innerDiameter: document.getElementById("innerDiameterValue"),
            thickness: document.getElementById("thicknessValue"),
            boltHoles: document.getElementById("boltHolesValue"),
            boltCircleDiameter: document.getElementById(
              "boltCircleDiameterValue",
            ),
            boltHoleSize: document.getElementById("boltHoleSizeValue"),
          };

          // Add event listeners with debouncing
          let updateTimeout;
          const debouncedUpdate = () => {
            clearTimeout(updateTimeout);
            updateTimeout = setTimeout(() => this.createFlange(), 100);
          };

          Object.keys(controls).forEach((key) => {
            const control = controls[key];
            if (!control) return;

            control.addEventListener("input", (e) => {
              if (key === "materialColor") {
                this.params[key] = parseInt(e.target.value.replace("#", "0x"));
              } else {
                this.params[key] = parseFloat(e.target.value);
              }

              if (valueDisplays[key]) {
                const value = e.target.value;
                valueDisplays[key].textContent =
                  key.includes("Diameter") ||
                  key.includes("Size") ||
                  key.includes("thickness")
                    ? `${value}mm`
                    : value;
              }

              debouncedUpdate();
            });
          });
        }

        setupEventListeners() {
          const canvas = this.renderer.domElement;

          // Mouse controls
          canvas.addEventListener("mousedown", (e) => {
            this.mouse.isDown = true;
            this.mouse.lastX = e.clientX;
            this.mouse.lastY = e.clientY;
          });

          canvas.addEventListener("mousemove", (e) => {
            if (!this.mouse.isDown) return;

            const deltaX = e.clientX - this.mouse.lastX;
            const deltaY = e.clientY - this.mouse.lastY;

            this.rotation.targetY += deltaX * 0.01;
            this.rotation.targetX += deltaY * 0.01;

            this.mouse.lastX = e.clientX;
            this.mouse.lastY = e.clientY;
          });

          canvas.addEventListener("mouseup", () => {
            this.mouse.isDown = false;
          });

          canvas.addEventListener("wheel", (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY > 0 ? 1.1 : 0.9;
            this.camera.position.multiplyScalar(zoomFactor);
            this.camera.position.clampLength(20, 200);
          });

          // Touch controls
          canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            if (e.touches.length === 1) {
              this.mouse.isDown = true;
              this.mouse.lastX = e.touches[0].clientX;
              this.mouse.lastY = e.touches[0].clientY;
            }
          });

          canvas.addEventListener("touchmove", (e) => {
            e.preventDefault();
            if (this.mouse.isDown && e.touches.length === 1) {
              const deltaX = e.touches[0].clientX - this.mouse.lastX;
              const deltaY = e.touches[0].clientY - this.mouse.lastY;

              this.rotation.targetY += deltaX * 0.01;
              this.rotation.targetX += deltaY * 0.01;

              this.mouse.lastX = e.touches[0].clientX;
              this.mouse.lastY = e.touches[0].clientY;
            }
          });

          canvas.addEventListener("touchend", (e) => {
            e.preventDefault();
            this.mouse.isDown = false;
          });

          // Window resize
          window.addEventListener("resize", () => {
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
          });
        }

        animate() {
          requestAnimationFrame(() => this.animate());

          // Smooth rotation
          if (this.flangeGroup) {
            this.rotation.x += (this.rotation.targetX - this.rotation.x) * 0.1;
            this.rotation.y += (this.rotation.targetY - this.rotation.y) * 0.1;

            this.flangeGroup.rotation.x = this.rotation.x;
            this.flangeGroup.rotation.y = this.rotation.y;
          }

          this.renderer.render(this.scene, this.camera);
        }

        showUI() {
          document.getElementById("loading").style.display = "none";
          document.getElementById("ui-panel").style.display = "block";
        }

        showError(message) {
          const loading = document.getElementById("loading");
          loading.textContent = `Error: ${message}`;
          loading.className = "error";
        }
      }

      // Initialize the application
      window.addEventListener("load", async () => {
        try {
          await loadThreeJS();
          new FlangeDesigner();
        } catch (error) {
          console.error("Failed to initialize:", error);
          const loading = document.getElementById("loading");
          if (loading) {
            loading.textContent = `Error: ${error.message}`;
            loading.className = "error";
          }
        }
      });
    </script>
